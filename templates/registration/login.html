{% load static %}
<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход - Drop and Tag</title>
    <link rel="stylesheet" href="{% static 'vendor/bootstrap/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'photos/styles.css' %}?v=20260804-collapsed-filters">
  </head>
  <body class="login-page">
    <main class="login-shell">
      <section class="login-card">
        <div class="brand-mark mb-3">DT</div>
        <h1 class="h3 mb-2">Drop and Tag</h1>
        <p class="text-secondary mb-4">Войдите, чтобы открыть To-Do List, напоминания, заметки и личные записи.</p>

        {% if form.errors %}
          <div class="alert alert-danger">Неверный логин или пароль.</div>
        {% endif %}

        {% if next %}
          <div class="alert alert-secondary">Сначала нужна авторизация.</div>
        {% endif %}

        <form method="post">
          {% csrf_token %}
          <input type="hidden" name="next" value="{{ next }}">

          <div class="mb-3">
            <label class="form-label" for="{{ form.username.id_for_label }}">Логин</label>
            <input class="form-control" type="text" name="{{ form.username.html_name }}" id="{{ form.username.id_for_label }}" autocomplete="username" required autofocus>
          </div>

          <div class="mb-3">
            <label class="form-label" for="{{ form.password.id_for_label }}">Пароль</label>
            <input class="form-control" type="password" name="{{ form.password.html_name }}" id="{{ form.password.id_for_label }}" autocomplete="current-password" required>
          </div>

          <button class="btn btn-success w-100" type="submit">Войти</button>
        </form>
      </section>
    </main>
  </body>
</html>
