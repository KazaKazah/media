{% load static %}<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Восстановление пароля — Drop and Tag</title><link rel="stylesheet" href="{% static 'vendor/bootstrap/bootstrap.min.css' %}"><link rel="stylesheet" href="{% static 'photos/styles.css' %}?v=20260902-auth"></head>
<body class="login-page"><main class="login-shell"><section class="login-card"><header class="login-header"><p class="login-eyebrow">DROP AND TAG</p><h1>Восстановление пароля</h1><p>Отправим ссылку на email из вашего профиля</p></header>
<form method="post" class="login-form">{% csrf_token %}<div class="login-field"><label for="{{ form.email.id_for_label }}">Email</label>{{ form.email }}{% for error in form.email.errors %}<small class="login-error">{{ error }}</small>{% endfor %}</div><button class="login-submit" type="submit">Отправить ссылку</button></form><p class="login-signup"><a href="{% url 'login' %}">Вернуться ко входу</a></p></section></main></body></html>
