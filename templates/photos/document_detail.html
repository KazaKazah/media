{% load static %}
<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ document.title }} - Drop and Tag</title>
    <link rel="stylesheet" href="{% static 'vendor/bootstrap/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'photos/styles.css' %}?v=20260801-gallery-manager">
  </head>
  <body class="document-reader-page">
    {% include 'photos/_app_navbar.html' %}
    <main class="reader-shell">
      <nav class="detail-nav reader-nav">
        <a href="{% url 'photos:documents' %}">Назад к документам</a>
        <a href="{% url 'photos:todo' %}">To-Do List</a>
        <a href="{% url 'photos:index' %}">Тайтлы</a>
      </nav>
      <header class="reader-header">
        <div>
          <h1>{{ document.title }}</h1>
          <p>{{ document.original_filename }} · {{ document.updated_at|date:"d.m.Y H:i" }}</p>
        </div>
        <form method="post" action="{% url 'photos:document_delete' document.pk %}" onsubmit="return confirm('Удалить документ «{{ document.title|escapejs }}»?');">
          {% csrf_token %}
          <button class="btn btn-outline-danger" type="submit">Удалить</button>
        </form>
      </header>
      <article class="reader-content">
        {{ document.content|linebreaks }}
      </article>
    </main>
  </body>
</html>
