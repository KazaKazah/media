<header class="global-app-nav">
  <a class="global-app-brand" href="{% url 'photos:index' %}"><span>DT</span><strong>Drop and Tag</strong></a>
  <nav aria-label="Основные разделы">
    <a class="{% if request.resolver_match.url_name == 'index' or request.resolver_match.url_name == 'title_detail' or request.resolver_match.url_name == 'title_characters' or request.resolver_match.url_name == 'character_detail' or request.resolver_match.url_name == 'character_gallery' or request.resolver_match.url_name == 'character_gallery_upload' %}active{% endif %}" href="{% url 'photos:index' %}">Тайтлы</a>
    {% if request.user.is_authenticated %}
      <a class="{% if request.resolver_match.url_name == 'todo' %}active{% endif %}" href="{% url 'photos:todo' %}">Задачи</a>
      <a class="{% if request.resolver_match.url_name == 'documents' or request.resolver_match.url_name == 'document_detail' %}active{% endif %}" href="{% url 'photos:documents' %}">Документы</a>
      {% if request.user.is_staff or request.user.is_superuser %}<a class="{% if request.resolver_match.url_name == 'media_library' %}active{% endif %}" href="{% url 'photos:media_library' %}">Медиатека</a>{% endif %}
    {% endif %}
  </nav>
  <div class="global-app-account">{% if request.user.is_authenticated %}<span>{{ request.user.username }}</span>{% else %}<a href="{% url 'login' %}?next={{ request.path|urlencode }}">Войти</a>{% endif %}</div>
</header>
