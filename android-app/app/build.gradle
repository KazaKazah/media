plugins {
    id "com.android.application"
}

android {
    namespace "kz.zhuamedic.dropandtag"
    compileSdk 36

    defaultConfig {
        applicationId "kz.zhuamedic.dropandtag"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
        buildConfigField "String", "APP_URL", "\"https://media.zhuamedic.kz/\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
